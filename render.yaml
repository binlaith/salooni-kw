# Render Blueprint — نشر منصة صالوني Salooni KW على استضافة مجانية
# الاسم أدناه (salooni-kw) يحدّد الرابط: https://salooni-kw.onrender.com
services:
  - type: web
    name: salooni-kw
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
